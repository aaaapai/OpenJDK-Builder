name: Build JDK for Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      java_version:
        description: 'JDK 版本（push/PR 时自动用 28）'
        required: true
        default: '28'
        type: choice
        options:
          - '28'
          - '26'
      target_arch:
        description: '目标架构（push/PR 时自动用 arm64）'
        required: true
        default: 'arm64'
        type: choice
        options:
          - 'arm64'
          - 'arm32'
          - 'x86_64'
          - 'x86'
          - 'riscv64'
      android_api:
        description: '最低 Android API 等级（push/PR 时自动用 26；riscv64 自动抬升至 35；选 21/22 且构建 27/28 时自动应用 hash_style_android21.patch）'
        required: true
        default: '26'
        type: choice
        options:
          - '21'
          - '24'
          - '26'
          - '28'
          - '30'
          - '33'
          - '34'
          - '35'
          - '36'

env:
  TARGET_OS: android

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_JAVA_VERSION: ${{ inputs.java_version || '28' }}
      TARGET_ARCH: ${{ inputs.target_arch || 'arm64' }}
      ANDROID_API: ${{ inputs.android_api || '26' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: "5G"
          key: "android-${{ env.TARGET_ARCH }}-api${{ env.ANDROID_API }}-jdk${{ env.TARGET_JAVA_VERSION }}"
          restore-keys: |
            android-${{ env.TARGET_ARCH }}-api
            android-${{ env.TARGET_ARCH }}-
            android-
          create-symlink: true

      - name: Set up Java
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '26'

      # 第4步: 提权并运行依赖安装脚本
      - name: Install dependencies
        run: |
          chmod +x ./scripts/install_deps.bash
          ./scripts/install_deps.bash

      - name: Build JDK
        run: |
          sudo chmod +x ./scripts/build_jdk.bash
          bash ./scripts/build_jdk.bash


      # 第6步: 上传构建产物 (openjdk-build 文件夹)
      - name: Upload JRE build artifacts
        uses: actions/upload-artifact@main
        with:
          name: openjdk-jre${{ env.TARGET_JAVA_VERSION }}-build-${{ env.TARGET_ARCH }}
          path: openjdk/build/**/images/jre${{ env.TARGET_JAVA_VERSION }}*.tar.xz
          if-no-files-found: error

      - name: Upload JDK build artifacts
        uses: actions/upload-artifact@main
        with:
          name: openjdk-jdk${{ env.TARGET_JAVA_VERSION }}-build-${{ env.TARGET_ARCH }}
          path: openjdk/build/**/images/jdk${{ env.TARGET_JAVA_VERSION }}*.tar.xz
          if-no-files-found: error

      - name: Upload debuginfo build artifacts
        uses: actions/upload-artifact@main
        with:
          name: openjdk-symbols${{ env.TARGET_JAVA_VERSION }}-build-${{ env.TARGET_ARCH }}
          path: openjdk/build/**/images/symbols${{ env.TARGET_JAVA_VERSION }}*.tar.xz
          if-no-files-found: error
