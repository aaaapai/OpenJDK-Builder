name: Build JDK for Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  ANDROID_API: 26
  TARGET_ARCH: arm64
  TARGET_OS: android
  TARGET_JAVA_VERSION: 27

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: "5G"

      - name: Setup ccache in PATH
        run: |
           echo "/usr/lib/ccache" >> $GITHUB_PATH
           echo "CCACHE_DIR=/home/runner/work/OpenJDK-Builder/OpenJDK-Builder/.ccache" >> $GITHUB_ENV
           echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
  
      # 第3步: 设置 Java (版本 26, Zulu 供应商)
      - name: Set up Java
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '26'

      # 第4步: 提权并运行依赖安装脚本
      - name: Install dependencies
        run: |
          chmod +x ./scripts/install_deps.bash
          ./scripts/install_deps.bash

      # 第5步: 提权并运行 JDK 构建脚本
      - name: Build JDK
        run: |
          sudo chmod +x ./scripts/build_jdk.bash
          bash ./scripts/build_jdk.bash

      - name: Upload unfinished output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openjdk-unfinished-build
          path: openjdk/build/aarch64-linux-android
          if-no-files-found: error

      # 第6步: 上传构建产物 (openjdk-build 文件夹)
      - name: Upload JDK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openjdk-build
          path: openjdk/build/aarch64-linux-android/jdk
          if-no-files-found: error
